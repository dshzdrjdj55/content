<title>Nhớ Lâu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: AnkiWeb-like single column (max 720px), grey top bar, flashcard surface, fixed answer bar / tab bar at the bottom */
:root{
  --bg:#ffffff; --nav:#eceef0; --surface:#f8f7f4; --fg:#1c2024; --muted:#68717a; --line:#d6dbe0;
  --accent:#0b5ed7; --accent-strong:#0a53be; --accent-fg:#ffffff; --accent-ring:#8fb8f5;
  --pill-bg:#e3ebfb; --pill-fg:#2c4d9e;
  --new:#1747d6; --learn:#b8232a; --rev:#1b8637;
  --danger:#c62f2f; --overlay:rgba(20,24,28,.45); --shadow:0 8px 28px rgba(20,30,50,.16);
  --f-display:"Be Vietnam Pro","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --card-size:1.55rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171a; --nav:#1f2327; --surface:#1c2024; --fg:#e7eaed; --muted:#9aa3ac; --line:#323940;
  --accent:#3d86f0; --accent-strong:#5b98f2; --accent-fg:#ffffff; --accent-ring:#2c5ea8;
  --pill-bg:#22314d; --pill-fg:#a9c3f6; --new:#7fa3ff; --learn:#ff7f7f; --rev:#5fcf7b;
  --danger:#ff6b6b; --overlay:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171a; --nav:#1f2327; --surface:#1c2024; --fg:#e7eaed; --muted:#9aa3ac; --line:#323940;
  --accent:#3d86f0; --accent-strong:#5b98f2; --accent-fg:#ffffff; --accent-ring:#2c5ea8;
  --pill-bg:#22314d; --pill-fg:#a9c3f6; --new:#7fa3ff; --learn:#ff7f7f; --rev:#5fcf7b;
  --danger:#ff6b6b; --overlay:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-ring);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1.25rem;background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:34px;height:34px}
.menu-btn{width:52px;height:40px;border:1px solid var(--line);border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer}
.menu-btn span{display:block;width:24px;height:2px;background:var(--fg);box-shadow:0 -7px 0 var(--fg),0 7px 0 var(--fg)}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 6px);background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:240px;padding:6px;display:flex;flex-direction:column}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--nav)}
.menu .sync{font-size:.8rem;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line);margin-top:4px}

main{padding-block:14px 120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 16px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--pill-bg)}
.btn.solid{background:var(--accent);color:var(--accent-fg)}
.btn.solid:hover{background:var(--accent-strong)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:.95rem}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.ghost{border-color:var(--line);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}

.counts{font-variant-numeric:tabular-nums;font-size:1.35rem;white-space:nowrap}
.counts .n{color:var(--new)}.counts .l{color:var(--learn)}.counts .r{color:var(--rev)}
.counts .plus{color:var(--muted);font-size:.85rem;margin:0 3px}
.counts .cur{text-decoration:underline;text-underline-offset:3px}

/* deck list */
.h1{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.decks{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.decks .head,.deck{display:grid;grid-template-columns:1fr repeat(3,46px) 40px;align-items:center;gap:4px}
.decks .head{background:var(--nav);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 8px 8px 14px}
.decks .head span{text-align:center}
.deck{border-top:1px solid var(--line);padding:4px 8px 4px 14px}
.deck .name{background:none;border:0;text-align:left;padding:10px 0;cursor:pointer;font-weight:600;font-size:1.05rem;min-width:0;overflow-wrap:anywhere;color:var(--accent)}
.deck .num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.deck .num.zero{color:var(--muted);opacity:.5;font-weight:400}
.gear{width:36px;height:36px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.gear:hover{background:var(--nav)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center}
.empty p{color:var(--muted);max-width:44ch;margin:8px auto 18px}

/* study */
.study-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.study-bar .tools{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:6px;padding:40px clamp(18px,5vw,40px) 44px;min-height:280px}
.card .pill{display:table;margin:0 auto 18px;background:var(--pill-bg);color:var(--pill-fg);border-radius:999px;padding:4px 18px;font-size:calc(var(--card-size)*.68)}
.card .q .snd,.card .a .snd{font-size:1rem}
.card .q{font-family:var(--f-display);font-weight:700;font-size:var(--card-size);line-height:1.5;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:balance;margin:0}
.card hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.card .a{font-size:calc(var(--card-size)*.82);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.answer-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:8px}
.answer-bar .wrap{display:flex;justify-content:center}
.ease{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:520px}
.ease div{display:flex;flex-direction:column;align-items:center;gap:2px}
.ease small{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.ease .btn{width:100%;padding:6px 4px;font-size:1.05rem}
.ease .again{background:var(--learn);border-color:var(--learn);color:#fff}
.ease .good{background:var(--rev);border-color:var(--rev);color:#fff}
.show-btn{min-width:200px;font-size:1.1rem;min-height:48px;box-shadow:0 0 0 4px var(--accent-ring)}
.done{text-align:center;padding:40px 12px}
.done h2{font-family:var(--f-display);font-size:1.4rem;margin:0 0 8px}
.done p{color:var(--muted);margin:0 auto 18px;max-width:44ch}

/* forms */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.92rem}
.field .hint{color:var(--muted);font-size:.82rem}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content;margin-bottom:14px}
.seg button{border:0;background:none;padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
details.adv{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
details.adv summary{cursor:pointer;font-weight:600}
details.adv .grid2{margin-top:12px}

/* browse */
.filters{display:grid;grid-template-columns:1fr minmax(120px,190px);gap:10px;margin-bottom:12px}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--nav)}
.item .f{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{grid-column:1/-1;color:var(--muted);font-size:.82rem;display:flex;gap:10px;flex-wrap:wrap}
.state{font-size:.75rem;padding:2px 8px;border-radius:999px;font-weight:600;align-self:start}
.state.s0{background:var(--pill-bg);color:var(--new)}
.state.s1,.state.s3{background:color-mix(in srgb,var(--learn) 14%,transparent);color:var(--learn)}
.state.s2{background:color-mix(in srgb,var(--rev) 14%,transparent);color:var(--rev)}
.state.due{outline:1.5px solid currentColor}
.more{display:block;margin:12px auto 0}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:.85rem}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:26px;height:26px}
.tabnum{font-size:.7rem;font-weight:700;border:2px solid currentColor;border-radius:6px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 3px;font-variant-numeric:tabular-nums}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:600px){.overlay{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@media (min-width:600px){.sheet{border-radius:14px}}
.sheet h3{font-family:var(--f-display);margin:0 0 14px;font-size:1.2rem}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.sheet .foot .spacer{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.card img.media{display:block;max-width:100%;max-height:60vh;height:auto;margin:12px auto;border-radius:6px}
.card img.media:not([src]){min-height:60px;min-width:60px;background:var(--line)}
.snd{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:var(--bg);color:var(--accent);cursor:pointer;vertical-align:middle;margin:4px}
.snd svg{width:20px;height:20px}
.snd.playing{background:var(--accent);color:var(--accent-fg)}
.mtools{display:flex;gap:8px;flex-wrap:wrap}
.mtools .btn{min-height:32px;padding:2px 10px;font-size:.88rem}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.type-in{display:block;max-width:440px;margin:22px auto 0;text-align:center;font-size:calc(var(--card-size)*.75);padding:12px 14px}
.tans{max-width:560px;margin:0 auto 22px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:calc(var(--card-size)*.72);display:grid;gap:6px;text-align:center}
.tline{display:flex;gap:10px;justify-content:center;align-items:baseline;flex-wrap:wrap;overflow-wrap:anywhere}
.tlab{font-family:var(--f-body);font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tans .ok{color:var(--rev)}
.tans .bad{color:var(--learn);text-decoration:line-through;background:color-mix(in srgb,var(--learn) 14%,transparent)}
.tans .miss{color:var(--muted)}
.tans .need{color:var(--fg);background:color-mix(in srgb,var(--rev) 22%,transparent);font-weight:700}
.verdict{font-family:var(--f-body);font-size:.8em}
.verdict.v-ok{color:var(--rev)}.verdict.v-bad{color:var(--learn)}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.muted{color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header class="top">
  <div class="wrap gut" style="position:relative">
    <button class="brand" id="brand" type="button" aria-label="Về danh sách bộ thẻ">
      <span>Nhớ Lâu</span>
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="9" y="6" width="20" height="26" rx="4" transform="rotate(-12 19 19)" fill="none" stroke="#1aa3e8" stroke-width="3"/><rect x="13" y="9" width="20" height="26" rx="4" transform="rotate(8 23 22)" fill="#1aa3e8" fill-opacity=".18" stroke="#1aa3e8" stroke-width="3"/></svg>
    </button>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Mở menu" aria-expanded="false"><span></span></button>
    <div class="menu" id="menu" hidden>
      <button type="button" data-go="decks">Bộ thẻ</button>
      <button type="button" data-go="add">Thêm thẻ mới</button>
      <button type="button" data-go="browse">Tất cả các thẻ</button>
      <button type="button" id="mExport">Xuất dữ liệu (JSON)</button>
      <button type="button" id="mImport">Nhập bộ thẻ Anki (.apkg) / JSON</button>
      <button type="button" id="mHelp">Cách tính lịch ôn</button>
      <div class="sync" id="syncNote">Đang kết nối…</div>
    </div>
  </div>
</header>
<input type="file" id="fileIn" accept=".apkg,.colpkg,.json,.txt,.tsv,.csv,application/json,text/plain" hidden>

<main class="gut"><div class="wrap" id="view"></div></main>
<div id="bottom"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const MIN = 60e3, DAY = 864e5, ROLLOVER_H = 4, LEARN_AHEAD = 20 * MIN;

/* Anki-like default options */
const DEF = {
  newPerDay: 20, revPerDay: 200,
  learnSteps: [1, 10], gradIvl: 1, easyIvl: 4,
  relearnSteps: [10], lapseMult: 0, minIvl: 1,
  startEase: 2.5, easyBonus: 1.3, hardMult: 1.2, ivlMod: 1, maxIvl: 36500
};

/* A "day" starts at 4:00 local time, like Anki */
function dayOf(ts) {
  const d = new Date(ts - ROLLOVER_H * 3600e3);
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
}
function dayStart(day) { const d = new Date(day * DAY); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), ROLLOVER_H).getTime(); }
const today = () => dayOf(Date.now());
function fmtDate(day) { const d = new Date(day * DAY); return `${d.getUTCDate()}/${d.getUTCMonth() + 1}/${d.getUTCFullYear()}`; }
const trim1 = x => String(Math.round(x * 10) / 10);
function fmtDays(d) { if (d < 30) return Math.max(1, Math.round(d)) + 'd'; if (d < 365) return trim1(d / 30) + 'mo'; return trim1(d / 365) + 'y'; }
function fmtMin(m) { if (m < 1) return '<1m'; if (m < 60) return Math.round(m) + 'm'; if (m < 1440) return trim1(m / 60) + 'h'; return fmtDays(m / 1440); }

/* ============ state ============ */
const S = { decks: {}, cards: {}, view: 'decks', deckId: null, cur: null, showAns: false, undo: null,
  browseQ: '', browseDeck: 'all', importKeepSched: true, played: null, typed: '', addType: false, bulkType: false, browseLimit: 60, addDeck: null, addTag: '', addMode: 'one', timer: null };

function conf(deck) { return { ...DEF, ...(deck?.conf || {}) }; }
function cardsOf(deckId) { return Object.values(S.cards).filter(c => c.deck === deckId); }
function deckToday(d) {
  const t = today();
  if (!d.today || d.today.day !== t) d.today = { day: t, newDone: 0, revDone: 0, reps: 0, newExtra: 0 };
  return d.today;
}
function deckList() { return Object.values(S.decks).sort((a, b) => a.name.localeCompare(b.name, 'vi')); }

/* ============ storage: Claude account (db) with browser fallback ============ */
const LS_KEY = 'nholau.v1';
const Store = {
  remote: null, base: null, chains: {}, mode: 'local', quiet: false, q: [], active: 0, assets: null,
  async loadAll(path) {
    const out = {};
    let last = null;
    for (let guard = 0; guard < 200; guard++) {
      let q = this.remote.collection(path);
      if (last) q = q.where('id', '>', last);
      const snap = await q.limit(1000).get();
      snap.docs.forEach(d => { if (d.exists) out[d.id] = clone(d.data()); });
      if (snap.size < 1000) break;
      last = snap.docs[snap.docs.length - 1].id;
    }
    return out;
  },
  slot(fn) { return new Promise((res, rej) => { this.q.push({ fn, res, rej }); this.pump(); }); },
  pump() {
    while (this.active < 6 && this.q.length) {
      const { fn, res, rej } = this.q.shift(); this.active++;
      Promise.resolve().then(fn).then(res, rej).finally(() => { this.active--; this.pump(); });
    }
  },
  enqueue(path, fn) {
    const p = (this.chains[path] || Promise.resolve()).then(() => this.slot(fn));
    this.chains[path] = p.catch(() => {});
    return p;
  },
  async flush() { await Promise.all(Object.values(this.chains)); },
  pending() { return this.active + this.q.length; },
  loadLocal() {
    try { const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (j) { S.decks = j.decks || {}; S.cards = j.cards || {}; } } catch (e) {}
  },
  saveLocal() { if (this.quiet) return; try { localStorage.setItem(LS_KEY, JSON.stringify({ decks: S.decks, cards: S.cards })); } catch (e) {} },
  async connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { setSync(); return; }
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) { setSync(); return; }
      const id = await user.id();
      if (!id) { setSync(); return; }
      this.base = 'data/users/' + id;
      setSync('Đang tải dữ liệu từ tài khoản…');
      let timedOut = false;
      const timer = setTimeout(() => { timedOut = true; setSync('Không tải được dữ liệu tài khoản. Đang dùng bản lưu trên máy.'); }, 10000);
      this.remote = db;
      const [decks, cards] = await Promise.all([this.loadAll(this.base + '/decks'), this.loadAll(this.base + '/cards')]);
      clearTimeout(timer);
      if (timedOut) { this.remote = null; return; }
      this.mode = 'remote';
      try { this.assets = await window.claude.use('assets'); } catch (e) { this.assets = null; }
      if (!Object.keys(decks).length && Object.keys(S.decks).length) {
        Object.values(S.decks).forEach(d => this.write('decks', d));
        Object.values(S.cards).forEach(c => this.write('cards', c));
      } else { S.decks = decks; S.cards = cards; }
      this.saveLocal(); setSync(); render();
    } catch (e) { console.warn(e); setSync('Không kết nối được tài khoản. Đang dùng bản lưu trên máy.'); }
  },

/* ============ scheduler (Anki SM-2 style) ============
   type: 0 new · 1 learning · 2 review · 3 relearning
   learning cards use `due` (timestamp); review cards use `dueDay` (day number) */
function schedule(c0, ease, cf, now) {

  if (c.type === 1 || c.type === 3) {
    const steps = c.type === 1 ? cf.learnSteps : cf.relearnSteps;
    const toReview = ivl => { c.type = 2; c.ivl = Math.min(cf.maxIvl, Math.max(1, Math.round(ivl))); c.dueDay = t + c.ivl; c.left = 0; delete c.due; };
    const gradGood = () => c.type === 1 ? cf.gradIvl : Math.max(cf.minIvl, c.ivl || 1);
    const gradEasy = () => c.type === 1 ? cf.easyIvl : Math.max(cf.minIvl, c.ivl || 1) + 1;
    if (!steps.length) { toReview(ease === 4 ? gradEasy() : gradGood()); return c; }
    c.left = Math.min(c.left || 0, steps.length - 1);
    if (ease === 1) { c.left = 0; c.due = now + steps[0] * MIN; }
    else if (ease === 2) {
      const m = c.left === 0 ? (steps.length > 1 ? (steps[0] + steps[1]) / 2 : Math.min(steps[0] * 1.5, steps[0] + 1440)) : steps[c.left];
      c.due = now + m * MIN;
    } else if (ease === 3) {
      c.left += 1;
      if (c.left >= steps.length) toReview(gradGood()); else c.due = now + steps[c.left] * MIN;
    } else toReview(gradEasy());

  }

  const ivl = Math.max(1, c.ivl || 1), late = Math.max(0, t - (c.dueDay ?? t));

    c.ivl = Math.max(cf.minIvl, Math.round(ivl * cf.lapseMult));
    if (cf.relearnSteps.length) { c.type = 3; c.left = 0; c.due = now + cf.relearnSteps[0] * MIN; }
    else c.dueDay = t + c.ivl;
    return c;
  }

  const good = Math.max(hard + 1, Math.round((ivl + late / 2) * c.ease * cf.ivlMod));

function renderStudy() {

  const k = counts(deck);
  const q = card ? queueOf(card) : '';
  const view = $('#view');
  const bar = `

    else if (learn) msg = `Còn thẻ đang học sẽ đến lại sau ${fmtMin((learn.due - Date.now()) / MIN)}. Trang sẽ tự hiện thẻ khi đến giờ.`;

    if ($('#dMore')) $('#dMore').onclick = () => { deckToday(deck).newExtra = (deckToday(deck).newExtra || 0) + 10; Store.write('decks', deck); render(); };
    $('#dBack').onclick = () => go('decks');
    if (learn) S.timer = setTimeout(render, Math.max(1000, learn.due - LEARN_AHEAD - Date.now() + 500));
  } else {
    view.innerHTML = bar + `
      <article class="card" aria-live="polite">
        ${card.tag ? `<span class="pill">${esc(card.tag)}</span>` : ''}
        <div class="q">${rich(card.front)}</div>
        ${card.typeAns && !S.showAns ? `<input class="input type-in" id="typeIn" type="text" placeholder="Gõ đáp án rồi nhấn Enter" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(S.typed)}" aria-label="Gõ đáp án">` : ''}
        ${S.showAns ? `<hr id="answer">${card.typeAns ? typeBlock(card) : ''}<div class="a">${rich(card.back)}</div>` : ''}
      </article>`;

      ti.oninput = () => S.typed = ti.value;
      ti.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); reveal(); } };
      if (S.played !== card.id + ':false:' + card.reps) setTimeout(() => ti.focus({ preventScroll: true }), 50);
    }
    const key = card.id + ':' + S.showAns + ':' + card.reps;

      toast(`Đã thêm ${rows.length} thẻ`); renderBottom();
    }
  };

function parseBulk(text) {
  const br = s => s.replace(/<br\s*\/?>/gi, '\n').replace(/&nbsp;/g, ' ').trim();
  return text.split(/\r?\n/).filter(l => l.trim() && !l.startsWith('#')).map(l => {
    let parts = l.includes('\t') ? l.split('\t') : l.split('|');
    if (parts.length < 2) return null;
    const f = br(parts[0].replace(/^"|"$/g, '')), b = br(parts.slice(1).join(l.includes('\t') ? '\n' : '|').replace(/^"|"$/g, ''));
    return f ? [f, b] : null;
  }).filter(Boolean);
}

function stateLabel(c) {
  const t = today();
  if (c.type === 0) return ['Mới', 's0', false];
  if (c.type === 1) return ['Đang học', 's1', c.due <= Date.now()];
  if (c.type === 3) return ['Học lại', 's3', c.due <= Date.now()];
  return [c.dueDay <= t ? 'Đến hạn' : 'Ôn ' + fmtDays(c.dueDay - t), 's2', c.dueDay <= t];
}

/* ---------- Anki .apkg / .colpkg ---------- */
const LIBS = {
  JSZip: 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  initSqlJs: 'https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-asm-memory-growth.js',
  fzstd: 'https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js'
};
function loadLib(name) {
  if (window[name]) return Promise.resolve(window[name]);
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = LIBS[name];
    s.onload = () => window[name] ? res(window[name]) : rej(new Error('Không tải được ' + name));
    s.onerror = () => rej(new Error('Không tải được thư viện ' + name + '. Kiểm tra kết nối mạng.'));
    document.head.appendChild(s);
  });
}
const isZstd = u8 => u8.length > 4 && u8[0] === 0x28 && u8[1] === 0xb5 && u8[2] === 0x2f && u8[3] === 0xfd;
function pb(buf) { // minimal protobuf reader -> {field: [values]}
  const out = {}; let i = 0;
  const varint = () => { let x = 0, s = 0, b; do { b = buf[i++]; x += (b & 127) * 2 ** s; s += 7; } while (b & 128 && i < buf.length); return x; };
  while (i < buf.length) {
    const key = varint(), f = Math.floor(key / 8), wt = key & 7; let v;
    if (wt === 0) v = varint(); else if (wt === 2) { const n = varint(); v = buf.subarray(i, i + n); i += n; }
    else if (wt === 5) { i += 4; continue; } else if (wt === 1) { i += 8; continue; } else break;
    (out[f] = out[f] || []).push(v);
  }
  return out;
}
const utf8 = u8 => new TextDecoder().decode(u8);
function tplFields(fmt) {
  const names = []; const re = /{{([^}]+)}}/g; let m;
  while ((m = re.exec(fmt))) { const t = m[1].trim(); if (/^[#^/!]/.test(t)) continue; const n = t.split(':').pop().trim(); if (n && n !== 'FrontSide' && !names.includes(n)) names.push(n); }
  return names;
}
function clozeText(s, n, side) {
  return s.replace(/{{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?}}/g, (_, c, ans, hint) => +c === n ? (side === 'q' ? `[${hint || '...'}]` : `[${ans}]`) : ans);
}
function htmlToText(html, mediaRef) {
  html = String(html || '').replace(/\[sound:([^\]]+)\]/g, (_, f) => { const r = mediaRef(f); return r ? `[sound:${r}]` : ''; });
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
  let out = '';
  const walk = n => {
    if (n.nodeType === 3) { out += n.nodeValue.replace(/\s+/g, ' '); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName;
    if (tag === 'SCRIPT' || tag === 'STYLE') return;
    if (tag === 'BR') { out += '\n'; return; }
    if (tag === 'IMG') { const r = mediaRef(decodeURIComponent(n.getAttribute('src') || '')); if (r) out += `[img:${r}]`; return; }
    const block = /^(DIV|P|LI|TR|H\d|UL|OL|TABLE|BLOCKQUOTE)$/.test(tag);
    if (block && out && !out.endsWith('\n')) out += '\n';
    if (tag === 'LI') out += '• ';
    n.childNodes.forEach(walk);
    if (block && !out.endsWith('\n')) out += '\n';
  };
  doc.body.firstChild.childNodes.forEach(walk);
  return out.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}
function progressDialog(title) {
  let closeFn;
  modal(`<h3>${esc(title)}</h3><p id="pgMsg" class="muted" style="margin:0">Đang chuẩn bị…</p><div class="progress"><i id="pgBar"></i></div>
    <div class="foot" id="pgFoot" hidden><button class="btn solid" type="button" id="pgOk">Xong</button></div>`, c => { closeFn = c; $('#ov').onmousedown = null; });
  return {
    set(msg, frac) { const m = $('#pgMsg'); if (m) m.textContent = msg; const b = $('#pgBar'); if (b && frac != null) b.style.width = Math.round(frac * 100) + '%'; },
    done(msg) { this.set(msg, 1); const f = $('#pgFoot'); if (f) { f.hidden = false; $('#pgOk').onclick = () => { closeFn(); go('decks'); }; } }
  };
}
async function importApkg(file) {
  $('#menu').hidden = true;
  const pg = progressDialog('Nhập bộ thẻ Anki');
  try {
    pg.set('Đang tải thư viện đọc file Anki…', 0.02);
    const [JSZip, initSqlJs] = await Promise.all([loadLib('JSZip'), loadLib('initSqlJs')]);
    const zip = await JSZip.loadAsync(file);
    const unz = async u8 => isZstd(u8) ? (await loadLib('fzstd')).decompress(u8) : u8;
    const colFile = zip.file('collection.anki21b') || zip.file('collection.anki21') || zip.file('collection.anki2');
    if (!colFile) throw new Error('Không thấy dữ liệu thẻ trong file. Hãy xuất lại từ Anki dạng "Anki Deck Package (.apkg)".');
    pg.set('Đang đọc dữ liệu thẻ…', 0.06);
    const SQL = await initSqlJs();
    const db = new SQL.Database(await unz(await colFile.async('uint8array')));
    const rows = (sql) => { try { const r = db.exec(sql)[0]; return r ? r.values : []; } catch (e) { return null; } };
    const col = rows('SELECT crt, models, decks FROM col')[0];
    const crt = col[0];

    // media map: index -> filename
    let mediaNames = {};
    const mf = zip.file('media');
    if (mf) {
      const raw = await unz(await mf.async('uint8array'));
      try { mediaNames = JSON.parse(utf8(raw)); }
      catch (e) { (pb(raw)[1] || []).forEach((entry, idx) => { const f = pb(entry); if (f[1]) mediaNames[idx] = utf8(f[1][0]); }); }
    }
    const byName = {}; Object.entries(mediaNames).forEach(([k, v]) => byName[v] = k);

    // note types: id -> {cloze, flds:[names], tmpls:{ord:{q,a}}}
    const models = {};
    const nt = rows('SELECT id, name, config FROM notetypes');
    if (nt && nt.length) {
      nt.forEach(([id]) => models[id] = { cloze: false, flds: [], tmpls: {} });
      (rows('SELECT ntid, ord, name FROM fields ORDER BY ntid, ord') || []).forEach(([ntid, ord, name]) => { if (models[ntid]) models[ntid].flds[ord] = name; });
      (rows('SELECT ntid, ord, config FROM templates') || []).forEach(([ntid, ord, cfg]) => {
        const f = pb(cfg); if (models[ntid]) models[ntid].tmpls[ord] = { q: f[1] ? utf8(f[1][0]) : '', a: f[2] ? utf8(f[2][0]) : '' };
      });
      Object.values(models).forEach(m => m.cloze = Object.values(m.tmpls).some(t => /{{cloze:/.test(t.q)));
    } else {
      Object.values(JSON.parse(col[1] || '{}')).forEach(m => {
        models[m.id] = { cloze: m.type === 1, flds: m.flds.map(f => f.name), tmpls: Object.fromEntries(m.tmpls.map(t => [t.ord, { q: t.qfmt, a: t.afmt }])) };
      });
    }
    // decks: id -> name
    const deckNames = {};
    const dk = rows('SELECT id, name FROM decks');
    if (dk && dk.length) dk.forEach(([id, name]) => deckNames[id] = String(name).split('\x1f').join('::'));
    else Object.values(JSON.parse(col[2] || '{}')).forEach(d => deckNames[d.id] = d.name);

    const notes = {};
    rows('SELECT id, mid, flds, tags FROM notes').forEach(([id, mid, flds, tags]) => notes[id] = { mid, flds: String(flds).split('\x1f'), tags: String(tags || '').trim() });
    const cards = rows('SELECT id, nid, did, odid, ord, type, queue, due, ivl, factor, reps, lapses, left FROM cards ORDER BY did, due, ord');
    db.close();
    if (!cards.length) throw new Error('File không có thẻ nào.');

    // upload referenced media once
    const needed = new Set();
    const scan = s => { String(s).replace(/\[sound:([^\]]+)\]/g, (_, f) => needed.add(f)).replace(/<img[^>]+src=["']?([^"' >]+)/gi, (_, f) => needed.add(decodeURIComponent(f))); };
    Object.values(notes).forEach(n => n.flds.forEach(scan));
    const refs = {}; let done = 0, failed = 0;
    const list = [...needed].filter(f => byName[f] != null);
    for (const f of list) {
      pg.set(`Đang tải ảnh / âm thanh ${done + 1}/${list.length}…`, 0.1 + 0.6 * done / Math.max(1, list.length));
      try {
        const entry = zip.file(String(byName[f]));
        if (entry) { const bytes = await unz(await entry.async('uint8array')); refs[f] = await Media.put(new Blob([bytes], { type: typeOf(f) }), f); }
      } catch (e) { console.warn(f, e); failed++; }
      done++;
    }
    const mediaRef = f => refs[f] || null;

    // build cards
    pg.set('Đang tạo thẻ…', 0.72);
    const keepSched = !!S.importKeepSched;
    const deckMap = {};
    const getDeck = did => {
      const name = deckNames[did] || file.name.replace(/\.[^.]+$/, '');
      if (!deckMap[name]) deckMap[name] = Object.values(S.decks).find(d => d.name === name) || createDeck(name);
      return deckMap[name].id;
    };
    const t = today(), now = Date.now();
    Store.quiet = true;
    let made = 0;
    cards.forEach(([cid, nid, did, odid, ord, type, queue, due, ivl, factor, reps, lapses, left], idx) => {
      const n = notes[nid]; const m = n && models[n.mid]; if (!m) return;
      const fv = {}; m.flds.forEach((name, i) => fv[name] = n.flds[i] ?? '');
      let front, back, typeAns = '';
      if (m.cloze) {
        const cf = tplFields((m.tmpls[0] || {}).q).filter(x => fv[x] != null);
        const main = cf[0] || m.flds[0];
        front = htmlToText(clozeText(fv[main], ord + 1, 'q'), mediaRef);
        if (/{{type:cloze:/.test((m.tmpls[0] || {}).q)) {
          const ans = []; String(fv[main]).replace(/{{c(\d+)::([\s\S]*?)(?:::[\s\S]*?)?}}/g, (_, c, a) => { if (+c === ord + 1) ans.push(a); });
          typeAns = normAns(htmlToText(ans.join(', '), () => null));
        }
        const extra = m.flds.filter(x => x !== main && fv[x] && tplFields((m.tmpls[0] || {}).a).includes(x));
        back = [htmlToText(clozeText(fv[main], ord + 1, 'a'), mediaRef), ...extra.map(x => htmlToText(fv[x], mediaRef))].filter(Boolean).join('\n\n');
      } else {
        const tp = m.tmpls[ord] || m.tmpls[0] || { q: '', a: '' };
        const tref = ((tp.q.match(/{{type:([^}]+)}}/) || [])[1] || '').trim();
        if (tref && fv[tref] != null) typeAns = normAns(htmlToText(fv[tref], () => null));
        let qf = tplFields(tp.q.replace(/{{type:[^}]+}}/g, '')).filter(x => fv[x] != null); if (!qf.length) qf = [m.flds[0]];
        let af = tplFields(tp.a).filter(x => fv[x] != null && !qf.includes(x)); if (!tp.a) af = m.flds.filter(x => !qf.includes(x));
        front = qf.map(x => htmlToText(fv[x], mediaRef)).filter(Boolean).join('\n');
        back = af.map(x => htmlToText(fv[x], mediaRef)).filter(Boolean).join('\n\n');
      }
      if (!front && !back) return;
      const c = makeCard(getDeck(odid || did), front || '(trống)', back, '', typeAns);
      c.created = now + idx;
      if (keepSched && type > 0 && queue >= -1) {
        c.reps = reps || 0; c.lapses = lapses || 0; c.ease = factor ? factor / 1000 : DEF.startEase; c.ivl = ivl > 0 ? ivl : 0;
        if (type === 2) { c.type = 2; c.ivl = Math.max(1, ivl); c.dueDay = dayOf(crt * 1000 + due * DAY + 3600e3); }
        else if (type === 1 || type === 3) {
          c.type = type; c.left = 0;
          c.due = due > 1e9 ? due * 1000 : now;
          if (type === 3 && !c.ivl) c.ivl = 1;
        }
        if (!c.ease || c.ease < 1.3) c.ease = DEF.startEase;
      }
      S.cards[c.id] = c; Store.write('cards', c); made++;
    });
    Store.quiet = false; Store.saveLocal();
    if (Store.remote) {
      const total = Store.pending();
      while (Store.pending() > 0) { pg.set(`Đang lưu lên tài khoản… còn ${Store.pending()} thẻ`, 0.75 + 0.25 * (1 - Store.pending() / Math.max(1, total))); await new Promise(r => setTimeout(r, 400)); }
      await Store.flush();
    }
    render();
    pg.done(`Đã nhập ${made} thẻ vào ${Object.keys(deckMap).length} bộ thẻ, kèm ${Object.keys(refs).length} file ảnh / âm thanh.` + (failed ? ` ${failed} file không tải lên được.` : ''));
  } catch (e) {
    Store.quiet = false; Store.saveLocal();
    console.warn(e); pg.done('Không nhập được: ' + (e.message || e));
  }
}

function importFile(file) {
  if (/\.(apkg|colpkg|zip)$/i.test(file.name)) { importApkg(file); return; }
  const r = new FileReader();
  r.onload = () => {
    const text = String(r.result || '');
    try {
      const j = JSON.parse(text);
      if (!j || typeof j.decks !== 'object' || typeof j.cards !== 'object') throw new Error('bad');
      let n = 0;
      Object.values(j.decks).forEach(d => { if (d && d.id && d.name) { S.decks[d.id] = d; Store.write('decks', d); } });
      Object.values(j.cards).forEach(c => { if (c && c.id && S.decks[c.deck]) { S.cards[c.id] = c; Store.write('cards', c); n++; } });
      toast(`Đã nhập ${n} thẻ`); go('decks');
    } catch (e) {
      const rows = parseBulk(text);
      if (!rows.length) { toast('File không đúng định dạng JSON hoặc Tab/|'); return; }
      const d = createDeck(file.name.replace(/\.[^.]+$/, ''));
      rows.forEach(([f, b]) => { const c = makeCard(d.id, f, b, ''); S.cards[c.id] = c; Store.write('cards', c); });
      toast(`Đã tạo bộ "${d.name}" với ${rows.length} thẻ`); go('decks');
    }
  };
  r.readAsText(file);
}

function zoom(dir) {
  let s = 1.55; try { s = parseFloat(localStorage.getItem('nholau.size')) || 1.55; } catch (e) {}
  s = Math.min(2.6, Math.max(1, s + dir * 0.15));
  document.documentElement.style.setProperty('--card-size', s + 'rem');
  try { localStorage.setItem('nholau.size', s); } catch (e) {}
}

document.addEventListener('keydown', e => {
  if (S.view !== 'study' || $('#modalRoot').innerHTML || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (!S.cur) return;
  if (!S.showAns && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
  else if (S.showAns && /^[1-4]$/.test(e.key)) { e.preventDefault(); answer(+e.key); }
  else if (S.showAns && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); answer(3); }
  else if (e.key.toLowerCase() === 'z' && (e.ctrlKey || e.metaKey)) undo();
});
